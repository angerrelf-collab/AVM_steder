<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afleveringssteder</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    padding:15px;
}

h1{
    text-align:center;
    margin-bottom:15px;
}

.controls{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:15px;
}

input, textarea, select, button{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    background:#1976d2;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#135ba1;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.card h3{
    color:#1976d2;
    margin-bottom:5px;
}

.kontor{
    font-weight:bold;
    margin-bottom:10px;
}

.tags{
    margin:10px 0;
}

.tag{
    display:inline-block;
    background:#e3f2fd;
    color:#0d47a1;
    padding:4px 8px;
    border-radius:12px;
    margin:2px;
    font-size:12px;
}

.tag-filter-panel{
    background:white;
    padding:10px;
    border-radius:8px;
}

.tag-filter-panel summary{
    cursor:pointer;
    font-weight:bold;
}

.tag-filter-options{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    margin:10px 0;
}

.tag-button{
    width:auto;
    padding:4px 8px;
    border:0;
    border-radius:12px;
    margin:2px;
    background:#e3f2fd;
    color:#0d47a1;
    font-size:12px;
}

.tag-button:hover{
    background:#bbdefb;
}

.tag-button[aria-pressed="true"]{
    background:#1976d2;
    color:white;
}

.tag-filter-clear{
    width:auto;
}

.actions{
    display:flex;
    justify-content:flex-end;
    margin-top:10px;
}

.action-menu{
    position:relative;
}

.action-menu summary{
    display:grid;
    width:40px;
    height:40px;
    place-items:center;
    border-radius:8px;
    background:#1976d2;
    color:white;
    cursor:pointer;
    font-size:24px;
    line-height:1;
    list-style:none;
}

.action-menu summary::-webkit-details-marker{
    display:none;
}

.action-menu-items{
    position:absolute;
    top:calc(100% + 4px);
    right:0;
    z-index:1;
    min-width:140px;
    padding:4px;
    background:white;
    border:1px solid #ccc;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

.action-menu-items button{
    text-align:left;
    white-space:nowrap;
}

.formBox{
    background:#fff;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.hidden{
    display:none;
}
</style>
</head>
<body>

<h1>📦 Afleveringssteder</h1>

<div class="controls">

<input type="text" id="search" placeholder="🔍 Søg navn, kontor eller tags">

<details class="tag-filter-panel">
    <summary>Filtrér på tags <span id="activeTagCount"></span></summary>
    <div class="tag-filter-options" id="tagFilters"></div>
    <button type="button" class="tag-filter-clear" id="clearTagFilters">Ryd tagfiltre</button>
</details>

<select id="sort">
    <option value="navn">Sortér efter navn</option>
    <option value="kontor">Sortér efter kontor</option>
</select>

<button onclick="toggleForm()">➕ Nyt afleveringssted</button>

<button onclick="exportJSON()">📥 Eksportér JSON</button>

<input type="file" id="importFile" accept=".json">

</div>

<div class="formBox hidden" id="formBox">

<input type="hidden" id="editIndex">

<input id="navn" placeholder="Navn">

<input id="kontor" placeholder="Kontornummer (fx R0.02)">

<input id="tags" placeholder="Tags (kommasepareret)">

<textarea id="beskrivelse" rows="4"
placeholder="Beskrivelse af hvordan man finder stedet"></textarea>

<button onclick="savePlace()">💾 Gem</button>

</div>

<div id="list"></div>

<script>

let steder = JSON.parse(localStorage.getItem("steder")) || [

{
    navn:"Mette ZA",
    kontor:"Indgang 4",
    tags:["Administration","Pakker"],
    beskrivelse:"Gå til indgang 4 og stil pakken i receptionen i stuen"
},

{
    navn:"Anæstesi",
    kontor:"L1.25.c",
    tags:["Afdeling","Pakker"],
    beskrivelse:"Op ved COP. Stil på bord"
},

{
    navn:"Øre næse hals ØNH",
    kontor:"1. sal",
    tags:["Afdeling","Pakker"],
    beskrivelse:"Gang N, over for COP. på bord."
},

{
    navn:"Paller til S5 lager",
    kontor:"Stuen ved gammel vare indlevering",
    tags:["Paller"],
    beskrivelse:"Dør før uniforms depot. Den er ikke markeret. Spø'r om at få åbnet døren, f.eks.Torben"
},

{
    navn:"Teknisk afdeling",
    kontor:"Stuen",
    tags:["Pakker"],
    beskrivelse:"i teknisk affdeling svinget. Op med elevattor. Kør forsigtig ind i elevator dør. Stil pakker på bordet."
},

{
    navn:"Patologisk afdeling, PATO",
    kontor:"LAB fløj 2. sal",
    tags:["Afhentning af prøver","Levering af prøver","Kl 9:30","Kl 1330","Pakker"],
    beskrivelse:"Lab fløj 2. sal. Der afleveres og hentes prøver. Pakker stilles på bordet."
},

{
    navn:"IMO & blodbank",
    kontor:"LAB fløj 1. sal",
    tags:["Pakker"],
    beskrivelse:"Pakker ind ad vinduet"
},

{
    navn:"Klinisk biologisk afdeling - KBA",
    kontor:"LAB fløj 1. sal",
    tags:["Pakker"],
    beskrivelse:"Fra IMO, fortsæt lige ud. Til højre for enden af gangen. Lige ud gennem dør. Prøver hentes og afleveres i postkassen på væg til højre. Pakker stilles på bord for enden af gangen.Husk at kølevarer skal i køleskab og seddel vendes"
},

{
    navn:"Klargøring",
    kontor:"Stuen",
    tags:["Paller","Pakker"],
    beskrivelse:"Der hvor du går ud til p-plads, gennem 2 døre. Der er skilt på dør"
},

{
    navn:"Akutten - AKUT",
    kontor:"Stuen",
    tags:["Pakker"],
    beskrivelse:"Ned ad gangen, gang på højre hånd, lige frem til den gule streg. 'Depot' på venstre hånd. Det roder med pakker :-)"
},
    
{
    navn:"Ort Pæd Kir",
    kontor:"Stuen",
    tags:["Afdeling","Pakker"],
    beskrivelse:"Stuen fra vandrehal, ned af Gang L, Borde indenfor dør"
},

{
    navn:"Dag Kir",
    kontor:"Stuen",
    tags:["Afdeling","Pakker"],
    beskrivelse:"I stuen ind fra vandrehal, gang A, stil på rulle bord over for C3"
},

{
    navn:"PET Scan",
    kontor:"Stuen",
    tags:["Afdeling","Pakker"],
    beskrivelse:"Gang O, helt ned for enden til venstre"
},

{
    navn:"Røntgen",
    kontor:"Kælder",
    tags:["Afdeling","Kælder","Paller"],
    beskrivelse:"Stil pallen til højre for dør i S gang ved de 4 containere"
}

];

const list = document.getElementById("list");
const tagFilters = document.getElementById("tagFilters");
const selectedTags = new Set();

function escapeHTML(value){
    return String(value).replace(/[&<>"']/g, character => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    })[character]);
}

function renderTagFilters(){
    const allTags = [...new Set(steder.flatMap(sted => sted.tags))].sort(
        (a,b) => a.localeCompare(b, "da")
    );

    tagFilters.innerHTML = allTags.map(tag => `
        <button type="button" class="tag-button" data-tag="${escapeHTML(tag)}"
            aria-pressed="${selectedTags.has(tag)}">${escapeHTML(tag)}</button>
    `).join("");

    document.getElementById("activeTagCount").textContent =
        selectedTags.size ? `(${selectedTags.size} valgt)` : "";
    document.getElementById("clearTagFilters").disabled =
        selectedTags.size === 0;
}

function toggleTagFilter(tag, openPanel = false){
    if(selectedTags.has(tag)){
        selectedTags.delete(tag);
    } else {
        selectedTags.add(tag);
    }

    if(openPanel){
        document.querySelector(".tag-filter-panel").open = true;
    }

    render();
}

function saveData(){
    localStorage.setItem("steder", JSON.stringify(steder));
}

function render(){

    let filtered = [...steder];

    const search =
    document.getElementById("search").value.toLowerCase();

    renderTagFilters();

    filtered = filtered.filter(sted =>
        (
            sted.navn.toLowerCase().includes(search) ||
            sted.kontor.toLowerCase().includes(search) ||
            sted.tags.join(" ").toLowerCase().includes(search) ||
            sted.beskrivelse.toLowerCase().includes(search)
        ) &&
        [...selectedTags].every(tag => sted.tags.includes(tag))
    );

    const sort =
    document.getElementById("sort").value;

    filtered.sort((a,b)=>{
        return a[sort].localeCompare(
            b[sort],
            'da',
            {numeric:true}
        );
    });

    list.innerHTML="";

    filtered.forEach(sted=>{

        const realIndex =
        steder.indexOf(sted);

        const tagsHTML =
        sted.tags.map(tag=>
            `<button type="button" class="tag tag-button" data-tag="${escapeHTML(tag)}"
                aria-pressed="${selectedTags.has(tag)}">${escapeHTML(tag)}</button>`
        ).join("");

        list.innerHTML += `
        <div class="card">

            <h3>${sted.navn}</h3>

            <div class="kontor">
                ${sted.kontor}
            </div>

            <div class="tags">
                ${tagsHTML}
            </div>

            <p>${sted.beskrivelse}</p>

            <div class="actions">
                <details class="action-menu">
                    <summary aria-label="Handlinger for ${escapeHTML(sted.navn)}">⋮</summary>
                    <div class="action-menu-items">
                        <button onclick="editPlace(${realIndex}); this.closest('details').open = false">
                            ✏️ Rediger
                        </button>
                        <button onclick="deletePlace(${realIndex})">
                            🗑️ Slet
                        </button>
                    </div>
                </details>
            </div>

        </div>
        `;
    });

}

tagFilters.addEventListener("click", event => {
    const button = event.target.closest("button[data-tag]");
    if(button){
        toggleTagFilter(button.dataset.tag);
    }
});

list.addEventListener("click", event => {
    const button = event.target.closest("button[data-tag]");
    if(button){
        toggleTagFilter(button.dataset.tag, true);
    }
});

document.getElementById("clearTagFilters").addEventListener("click", () => {
    selectedTags.clear();
    render();
});

function toggleForm(){
    document
        .getElementById("formBox")
        .classList.toggle("hidden");
}

function savePlace(){

    const navn =
    document.getElementById("navn").value.trim();

    const kontor =
    document.getElementById("kontor").value.trim();

    const tags =
    document.getElementById("tags").value
    .split(",")
    .map(t=>t.trim())
    .filter(Boolean);

    const beskrivelse =
    document.getElementById("beskrivelse").value.trim();

    const editIndex =
    document.getElementById("editIndex").value;

    if(!navn || !kontor){
        alert("Navn og kontornummer skal udfyldes");
        return;
    }

    const data = {
        navn,
        kontor,
        tags,
        beskrivelse
    };

    if(editIndex === ""){
        steder.push(data);
    } else {
        steder[editIndex] = data;
    }

    clearForm();
    saveData();
    render();
}

function editPlace(index){

    const sted = steder[index];

    document.getElementById("editIndex").value = index;
    document.getElementById("navn").value = sted.navn;
    document.getElementById("kontor").value = sted.kontor;
    document.getElementById("tags").value = sted.tags.join(", ");
    document.getElementById("beskrivelse").value = sted.beskrivelse;

    document.getElementById("formBox")
        .classList.remove("hidden");
}

function deletePlace(index){

    if(confirm("Slet dette afleveringssted?")){

        steder.splice(index,1);

        saveData();
        render();
    }
}

function clearForm(){

    document.getElementById("editIndex").value="";
    document.getElementById("navn").value="";
    document.getElementById("kontor").value="";
    document.getElementById("tags").value="";
    document.getElementById("beskrivelse").value="";
}

function exportJSON(){

    const data =
    JSON.stringify(steder,null,2);

    const blob =
    new Blob([data],
    {type:"application/json"});

    const a =
    document.createElement("a");

    a.href =
    URL.createObjectURL(blob);

    a.download =
    "afleveringssteder.json";

    a.click();
}

document
.getElementById("importFile")
.addEventListener("change",function(e){

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(){

        steder = JSON.parse(reader.result);

        saveData();

        render();
    };

    reader.readAsText(file);
});

document
.getElementById("search")
.addEventListener("input",render);

document
.getElementById("sort")
.addEventListener("change",render);

render();

</script>

</body>
</html>
